[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokyo-reuse-data"
version = "0.1.0"
description = "Local collection, validation, and export of Tokyo station and reuse-shop data"
requires-python = ">=3.10"
dependencies = ["pyshp>=2.3.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tokyo-reuse-data = "tokyo_reuse_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
